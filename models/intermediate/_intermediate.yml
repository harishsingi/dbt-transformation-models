version: 2

models:
  - name: int_orders_enriched
    description: One row per order with line-level revenue, cost, and profit rolled up.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: line_count
        description: Number of lines on the order; 0 for an order with no lines.
        tests: [not_null]
      - name: gross_revenue
        description: Sum of line revenue before discounts; 0 for an order with no lines.
        tests: [not_null]
      - name: total_cost
        description: Sum of line cost; 0 for an order with no lines.
        tests: [not_null]
      - name: gross_profit
        description: Gross revenue minus total cost.
        tests: [not_null]
      - name: discount_applied
        description: "{{ doc('discount_applied') }}"
        tests: [not_null]
      - name: net_revenue
        description: "{{ doc('net_revenue') }}"
        tests: [not_null]
      - name: unknown_product_lines
        description: Lines whose product_id has no product row; 0 on clean data.
        tests: [not_null]
  - name: int_customer_order_history
    description: One row per customer with order counts and lifetime revenue.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: order_count
        description: All orders placed, any status.
        tests: [not_null]
      - name: fulfilled_order_count
        description: Orders with a fulfilled status only; see docs for fulfilled_order.
        tests: [not_null]
      - name: lifetime_revenue
        description: Sum of net revenue over fulfilled orders only.
        tests: [not_null]
      - name: cancelled_orders
        tests: [not_null]
      - name: refunded_orders
        tests: [not_null]
